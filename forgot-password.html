<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://*.supabase.co;">
    <title>L2H - Recuperar Contraseña</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <script src="translations.js" defer></script>
    <script src="theme.js" defer></script>
    <script src="forgot-password.js" defer></script>
    
    <style>
        .password-recovery-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f0ff 0%, #f0e8ff 100%);
        }

        html[data-theme="dark"] .password-recovery-container {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        }

        .recovery-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        html[data-theme="dark"] .recovery-card {
            background: var(--card-bg);
            box-shadow: var(--shadow);
        }

        .recovery-card h1 {
            font-size: 28px;
            color: #4a5568;
            margin: 0 0 8px 0;
            font-weight: 700;
            text-align: center;
        }

        html[data-theme="dark"] .recovery-card h1 {
            color: var(--text-primary);
        }

        .recovery-card p {
            font-size: 14px;
            color: #718096;
            margin: 0 0 32px 0;
            text-align: center;
            line-height: 1.5;
        }

        html[data-theme="dark"] .recovery-card p {
            color: var(--text-secondary);
        }

        .recovery-icon {
            text-align: center;
            font-size: 48px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #718096;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        html[data-theme="dark"] .form-group label {
            color: var(--text-secondary);
        }

        .form-group label i {
            font-size: 12px;
            color: #667eea;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #718096;
            font-size: 14px;
        }

        html[data-theme="dark"] .input-icon {
            color: var(--text-secondary);
        }

        .form-group input {
            padding: 12px 14px 12px 40px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        html[data-theme="dark"] .form-group input {
            border-color: var(--input-border);
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .recovery-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .recovery-btn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .recovery-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .recovery-btn .spinner {
            display: none;
            animation: spin 1s linear infinite;
        }

        .recovery-btn.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .alert.show {
            display: flex;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #ebf8ff;
            color: #2c5282;
            border: 1px solid #bee3f8;
        }

        html[data-theme="dark"] .alert-success {
            background: #1e4620;
            color: #c3e6cb;
            border-color: #2d5930;
        }

        html[data-theme="dark"] .alert-error {
            background: #4a1c1c;
            color: #f5c6cb;
            border-color: #6b2828;
        }

        html[data-theme="dark"] .alert-info {
            background: #0f2a42;
            color: #bee3f8;
            border-color: #1a4d6b;
        }

        .recovery-footer {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid #cbd5e0;
            padding-top: 20px;
        }

        html[data-theme="dark"] .recovery-footer {
            border-top-color: var(--border-color);
        }

        .recovery-footer p {
            font-size: 13px;
            color: #718096;
            margin: 0;
        }

        .recovery-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .recovery-footer a:hover {
            color: #5568d3;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #5568d3;
        }

        .success-message {
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        .success-icon {
            font-size: 64px;
            color: #22863a;
            margin-bottom: 16px;
        }

        .success-message h2 {
            font-size: 24px;
            color: #22863a;
            margin: 0 0 12px 0;
        }

        html[data-theme="dark"] .success-message h2 {
            color: #85e89d;
        }

        .success-message p {
            color: #718096;
            font-size: 14px;
            margin: 8px 0;
        }

        html[data-theme="dark"] .success-message p {
            color: var(--text-secondary);
        }
    </style>
</head>
<body class="no-scroll">
    <div class="password-recovery-container">
        <div class="recovery-card">
            <a href="login.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                <span data-i18n="nav.back">Volver</span>
            </a>

            <div id="recoveryForm">
                <div class="recovery-icon">
                    <i class="fas fa-lock-open"></i>
                </div>
                <h1 data-i18n="password.recovery.title">Recuperar Contraseña</h1>
                <p data-i18n="password.recovery.subtitle">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña</p>

                <div id="alert" class="alert"></div>

                <form id="recoveryEmailForm">
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i>
                            <span data-i18n="login.email">Correo Electrónico</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fas fa-at input-icon"></i>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                required 
                                data-i18n-placeholder="login.email"
                                placeholder="tu@correo.com"
                            >
                        </div>
                    </div>

                    <button type="submit" class="recovery-btn" id="sendBtn">
                        <i class="fas fa-paper-plane"></i>
                        <span data-i18n="password.recovery.send">Enviar enlace</span>
                        <i class="fas fa-spinner spinner"></i>
                    </button>
                </form>
            </div>

            <div id="successMessage" class="success-message">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 data-i18n="password.recovery.success">¡Correo Enviado!</h2>
                <p data-i18n="password.recovery.checkEmail">Revisa tu bandeja de entrada y haz clic en el enlace para restablecer tu contraseña.</p>
                <p data-i18n="password.recovery.expireTime">El enlace expira en 24 horas.</p>
            </div>

            <div class="recovery-footer">
                <p>
                    <span data-i18n="login.noAccount">¿No tienes cuenta?</span>
                    <a href="register.html" data-i18n="login.registerLink">Regístrate aquí</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
