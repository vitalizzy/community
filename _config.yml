theme: jekyll-theme-minimal
title: Gestión de Usuarios
description: Sistema de autenticación y gestión de usuarios
show_downloads: false
github_repository_url: https://github.com/vitalizzy/community

# Jekyll Settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:path/

# Build settings
exclude:
  - node_modules
  - .git
  - .gitignore
