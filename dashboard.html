<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="main.css">
    <style>
        .dashboard-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #d9dde3;
        }

        .dashboard-nav h1 {
            margin: 0;
            font-size: 24px;
            color: #1f2933;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: #af2f2d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.3);
        }

        .welcome-section {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-section h2 {
            font-size: 28px;
            color: #1f2933;
            margin: 0 0 16px 0;
        }

        .welcome-section p {
            font-size: 16px;
            color: #52606d;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="financial-dashboard">
        <div class="dashboard-nav">
            <h1>Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
        </div>

        <div class="welcome-section">
            <h2>Bienvenido</h2>
            <p>Aquí irá el contenido de la aplicación</p>
        </div>
    </div>

    <script>
        function logout() {
            // Aquí iría la lógica de logout con Supabase
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
