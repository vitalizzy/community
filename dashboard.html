<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://*.supabase.co;">
    <title>L2H - Dashboard</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <script src="translations.js" defer></script>
    <script src="theme.js" defer></script>
    <script src="dashboard-auth.js" defer></script>
    <style>
        .dashboard-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #cbd5e0;
        }

        html[data-theme="dark"] .dashboard-nav {
            border-bottom-color: var(--border-color);
        }

        .dashboard-nav h1 {
            margin: 0;
            font-size: 24px;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        html[data-theme="dark"] .dashboard-nav h1 {
            color: var(--text-primary);
        }

        .dashboard-nav h1 i {
            color: #667eea;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #fc8181;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background: #f56565;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 101, 101, 0.3);
        }

        .logout-btn i {
            font-size: 16px;
        }

        .welcome-section {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-section .icon-wrapper {
            font-size: 64px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .welcome-section h2 {
            font-size: 28px;
            color: #4a5568;
            margin: 0 0 16px 0;
        }

        html[data-theme="dark"] .welcome-section h2,
        html[data-theme="dark"] .welcome-section p {
            color: var(--text-primary);
        }

        .welcome-section p {
            font-size: 16px;
            color: #718096;
            margin: 0;
        }

        /* Ocultar contenido hasta verificar autenticación */
        body.loading #dashboard-container {
            display: none;
        }

        /* Loader de autenticación */
        .auth-loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        html[data-theme="dark"] .auth-loader {
            background: var(--bg-primary);
        }

        body:not(.loading) .auth-loader {
            display: none;
        }

        .auth-loader-content {
            text-align: center;
        }

        .auth-loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="no-scroll loading">
    <!-- Loader mientras se verifica autenticación -->
    <div class="auth-loader">
        <div class="auth-loader-content">
            <div class="auth-loader-spinner"></div>
            <p style="color: #718096;">Verificando sesión...</p>
        </div>
    </div>

    <div id="dashboard-container">
        <div class="dashboard-nav">
            <h1>
                <i class="fas fa-chart-line"></i>
                <span data-i18n="dashboard.title">Panel de Control</span>
            </h1>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span data-i18n="nav.logout">Cerrar Sesión</span>
            </button>
        </div>

        <div class="welcome-section">
            <div class="icon-wrapper">
                <i class="fas fa-home"></i>
            </div>
            <h2 data-i18n="dashboard.welcome">Bienvenido a L2H</h2>
            <p data-i18n="dashboard.subtitle">Comunidad de Propietarios Lomas 2 - Portal de Gestión</p>
        </div>
    </div>

    <script>
        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
