<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2H - Dashboard</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="translations.js" defer></script>
    <script src="theme.js" defer></script>
    <style>
        .dashboard-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #cbd5e0;
        }

        html[data-theme="dark"] .dashboard-nav {
            border-bottom-color: var(--border-color);
        }

        .dashboard-nav h1 {
            margin: 0;
            font-size: 24px;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        html[data-theme="dark"] .dashboard-nav h1 {
            color: var(--text-primary);
        }

        .dashboard-nav h1 i {
            color: #667eea;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #fc8181;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background: #f56565;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 101, 101, 0.3);
        }

        .logout-btn i {
            font-size: 16px;
        }

        .welcome-section {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-section .icon-wrapper {
            font-size: 64px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .welcome-section h2 {
            font-size: 28px;
            color: #4a5568;
            margin: 0 0 16px 0;
        }

        html[data-theme="dark"] .welcome-section h2,
        html[data-theme="dark"] .welcome-section p {
            color: var(--text-primary);
        }

        .welcome-section p {
            font-size: 16px;
            color: #718096;
            margin: 0;
        }
    </style>
</head>
<body class="no-scroll">
    <div id="dashboard-container">
        <div class="dashboard-nav">
            <h1>
                <i class="fas fa-chart-line"></i>
                <span data-i18n="dashboard.title">Panel de Control</span>
            </h1>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span data-i18n="nav.logout">Cerrar Sesión</span>
            </button>
        </div>

        <div class="welcome-section">
            <div class="icon-wrapper">
                <i class="fas fa-home"></i>
            </div>
            <h2 data-i18n="dashboard.welcome">Bienvenido a L2H</h2>
            <p data-i18n="dashboard.subtitle">Comunidad de Propietarios Lomas 2 - Portal de Gestión</p>
        </div>
    </div>

    <script>
        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
