<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://*.supabase.co;">
    <title>L2H - Cambiar Contraseña</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <script src="translations.js" defer></script>
    <script src="theme.js" defer></script>
    <script src="change-password.js" defer></script>
    
    <style>
        .change-password-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f0ff 0%, #f0e8ff 100%);
        }

        html[data-theme="dark"] .change-password-container {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        }

        .change-password-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        html[data-theme="dark"] .change-password-card {
            background: var(--card-bg);
            box-shadow: var(--shadow);
        }

        .change-password-card h1 {
            font-size: 28px;
            color: #4a5568;
            margin: 0 0 8px 0;
            font-weight: 700;
            text-align: center;
        }

        html[data-theme="dark"] .change-password-card h1 {
            color: var(--text-primary);
        }

        .change-password-card p {
            font-size: 14px;
            color: #718096;
            margin: 0 0 32px 0;
            text-align: center;
        }

        html[data-theme="dark"] .change-password-card p {
            color: var(--text-secondary);
        }

        .password-icon {
            text-align: center;
            font-size: 48px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #718096;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        html[data-theme="dark"] .form-group label {
            color: var(--text-secondary);
        }

        .form-group label i {
            font-size: 12px;
            color: #667eea;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #718096;
            font-size: 14px;
        }

        html[data-theme="dark"] .input-icon {
            color: var(--text-secondary);
        }

        .form-group input {
            padding: 12px 14px 12px 40px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        html[data-theme="dark"] .form-group input {
            border-color: var(--input-border);
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .password-strength {
            margin-top: 6px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
        }

        html[data-theme="dark"] .password-strength {
            background: var(--input-border);
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .strength-bar.weak {
            width: 33%;
            background: #fc8181;
        }

        .strength-bar.medium {
            width: 66%;
            background: #fbd38d;
        }

        .strength-bar.strong {
            width: 100%;
            background: #68d391;
        }

        .password-requirements {
            font-size: 12px;
            color: #718096;
            margin-top: 8px;
        }

        html[data-theme="dark"] .password-requirements {
            color: var(--text-secondary);
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0;
        }

        .requirement-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .requirement-icon.pending {
            color: #cbd5e0;
        }

        .requirement-icon.met {
            color: #22863a;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #718096;
            font-size: 16px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #4a5568;
        }

        .change-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .change-btn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .change-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .change-btn .spinner {
            display: none;
            animation: spin 1s linear infinite;
        }

        .change-btn.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .alert.show {
            display: flex;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        html[data-theme="dark"] .alert-success {
            background: #1e4620;
            color: #c3e6cb;
            border-color: #2d5930;
        }

        html[data-theme="dark"] .alert-error {
            background: #4a1c1c;
            color: #f5c6cb;
            border-color: #6b2828;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #5568d3;
        }
    </style>
</head>
<body class="no-scroll loading">
    <div class="change-password-container">
        <div class="change-password-card">
            <a href="dashboard.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                <span data-i18n="nav.back">Volver</span>
            </a>

            <div class="password-icon">
                <i class="fas fa-lock"></i>
            </div>
            <h1 data-i18n="password.change.title">Cambiar Contraseña</h1>
            <p data-i18n="password.change.subtitle">Actualiza tu contraseña de forma segura</p>

            <div id="alert" class="alert"></div>

            <form id="changePasswordForm">
                <div class="form-group">
                    <label for="newPassword">
                        <i class="fas fa-key"></i>
                        <span data-i18n="password.change.newPassword">Nueva Contraseña</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="newPassword" 
                            name="newPassword" 
                            required
                            data-i18n-placeholder="register.password.placeholder"
                            placeholder="Mínimo 8 caracteres"
                        >
                        <button type="button" class="toggle-password" data-target="newPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="password-requirements">
                        <div class="requirement">
                            <span class="requirement-icon pending" id="req-length">
                                <i class="fas fa-check"></i>
                            </span>
                            <span data-i18n="password.req.length">Mínimo 8 caracteres</span>
                        </div>
                        <div class="requirement">
                            <span class="requirement-icon pending" id="req-upper">
                                <i class="fas fa-check"></i>
                            </span>
                            <span data-i18n="password.req.uppercase">Una mayúscula</span>
                        </div>
                        <div class="requirement">
                            <span class="requirement-icon pending" id="req-lower">
                                <i class="fas fa-check"></i>
                            </span>
                            <span data-i18n="password.req.lowercase">Una minúscula</span>
                        </div>
                        <div class="requirement">
                            <span class="requirement-icon pending" id="req-number">
                                <i class="fas fa-check"></i>
                            </span>
                            <span data-i18n="password.req.number">Un número</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-key"></i>
                        <span data-i18n="register.confirmPassword">Confirmar Contraseña</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            required
                            data-i18n-placeholder="register.confirmPassword.placeholder"
                            placeholder="Repite tu contraseña"
                        >
                        <button type="button" class="toggle-password" data-target="confirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="change-btn" id="changeBtn">
                    <i class="fas fa-save"></i>
                    <span data-i18n="password.change.button">Cambiar Contraseña</span>
                    <i class="fas fa-spinner spinner"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        // Proteger página si no hay sesión activa
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const session = await checkAuth();
                if (!session) {
                    window.location.href = 'login.html';
                }
                document.body.classList.remove('loading');
            } catch (error) {
                console.error('Error verificando sesión:', error);
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
