<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - Gestión de Usuarios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <link rel="stylesheet" href="{{ '/main.css' | relative_url }}">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background-color: #fafbfc;
            color: #24292e;
            line-height: 1.6;
        }

        .jekyll-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .jekyll-header {
            background: white;
            border-bottom: 1px solid #e1e4e8;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .jekyll-header h1 {
            margin: 0;
            font-size: 28px;
            color: #24292e;
        }

        .jekyll-footer {
            background: white;
            border-top: 1px solid #e1e4e8;
            padding: 20px 0;
            margin-top: 30px;
            text-align: center;
            color: #6a737d;
            font-size: 12px;
        }

        .jekyll-content {
            background: white;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #e1e4e8;
        }
    </style>
</head>
<body>
    <header class="jekyll-header">
        <div class="jekyll-container">
            <h1>{{ site.title }}</h1>
        </div>
    </header>

    <main class="jekyll-container">
        <div class="jekyll-content">
            {{ content }}
        </div>
    </main>

    <footer class="jekyll-footer">
        <div class="jekyll-container">
            <p>&copy; 2025 Gestión de Usuarios. Built with Jekyll &amp; GitHub Pages</p>
        </div>
    </footer>
</body>
</html>
