<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - L2H</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="theme.css">
    <style>
        .reset-password-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .reset-password-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--text-primary);
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.1);
        }

        .password-input-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
        }

        .toggle-password:hover {
            color: var(--text-primary);
        }

        .password-requirements {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            padding: 1rem;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .requirement:last-child {
            margin-bottom: 0;
        }

        .requirement-icon {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            background: var(--border-color);
            color: var(--text-secondary);
        }

        .requirement.met .requirement-icon {
            background: var(--success-color);
            color: white;
        }

        .requirement.met {
            color: var(--success-color);
        }

        .strength-bar {
            height: 0.5rem;
            background: var(--border-color);
            border-radius: 0.25rem;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .strength-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            background: var(--error-color);
        }

        .strength-bar-fill.weak {
            background: var(--error-color);
        }

        .strength-bar-fill.medium {
            background: var(--warning-color);
        }

        .strength-bar-fill.strong {
            background: var(--success-color);
        }

        .strength-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .alert {
            padding: 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(var(--error-rgb), 0.1);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        .alert-success {
            background: rgba(var(--success-rgb), 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .alert-warning {
            background: rgba(var(--warning-rgb), 0.1);
            color: var(--warning-color);
            border: 1px solid var(--warning-color);
        }

        .btn-submit {
            padding: 0.75rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-submit:hover:not(:disabled) {
            opacity: 0.9;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .back-link {
            text-align: center;
            margin-top: 1rem;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.75rem;
            margin: 0 0 0.5rem 0;
            color: var(--text-primary);
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin: 0;
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .loading {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-submit:disabled .loading {
            display: inline-block;
            margin-right: 0.5rem;
        }

        .success-container {
            text-align: center;
            display: none;
        }

        .success-container.show {
            display: block;
        }

        .success-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: pulse 0.5s ease-in;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
        }

        .success-container h2 {
            color: var(--success-color);
            margin-bottom: 0.5rem;
        }

        .success-container p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .redirect-countdown {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="reset-password-container">
        <!-- Form Container -->
        <div id="form-container">
            <div class="header">
                <div class="icon">🔐</div>
                <h1 id="title">Reset Password</h1>
                <p id="subtitle">Enter your new password below</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="reset-password-form" class="reset-password-form">
                <!-- New Password Field -->
                <div class="form-group">
                    <label for="new-password" id="label-newPassword">New Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="new-password"
                            placeholder="••••••••"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('new-password')">
                            👁️
                        </button>
                    </div>
                </div>

                <!-- Password Strength Indicator -->
                <div>
                    <div class="strength-bar">
                        <div id="strength-bar-fill" class="strength-bar-fill"></div>
                    </div>
                    <div class="strength-text">
                        <span id="strength-text">Password Strength: Weak</span>
                    </div>
                </div>

                <!-- Password Requirements -->
                <div class="password-requirements">
                    <div class="requirement" id="req-length">
                        <div class="requirement-icon">✓</div>
                        <span id="req-length-text">Minimum 8 characters</span>
                    </div>
                    <div class="requirement" id="req-uppercase">
                        <div class="requirement-icon">✓</div>
                        <span id="req-uppercase-text">One uppercase letter</span>
                    </div>
                    <div class="requirement" id="req-lowercase">
                        <div class="requirement-icon">✓</div>
                        <span id="req-lowercase-text">One lowercase letter</span>
                    </div>
                    <div class="requirement" id="req-number">
                        <div class="requirement-icon">✓</div>
                        <span id="req-number-text">One number</span>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirm-password" id="label-confirmPassword">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="confirm-password"
                            placeholder="••••••••"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm-password')">
                            👁️
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="submit-btn">
                    <span id="btn-text">Reset Password</span>
                </button>
            </form>

            <div class="back-link">
                <a href="login.html" id="back-link">← Back to login</a>
            </div>
        </div>

        <!-- Success Container -->
        <div id="success-container" class="success-container">
            <div class="success-icon">✓</div>
            <h2 id="success-title">Password Reset Successful!</h2>
            <p id="success-message">Your password has been successfully updated.</p>
            <p class="redirect-countdown">
                <span id="countdown-text">Redirecting to login in 3 seconds...</span>
            </p>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script src="theme.js"></script>
    <script src="translations.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
