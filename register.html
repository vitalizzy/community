<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="main.css">
    <style>
        .register-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f0ff 0%, #f0e8ff 100%);
            padding: 20px;
        }

        .register-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        .register-card h1 {
            font-size: 28px;
            color: #4a5568;
            margin: 0 0 8px 0;
            font-weight: 700;
            text-align: center;
        }

        .register-card p {
            font-size: 14px;
            color: #718096;
            margin: 0 0 32px 0;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #718096;
        }

        .form-group input {
            padding: 12px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .form-group select {
            padding: 12px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background-color: white;
            cursor: pointer;
        }

        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-row-full {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 500px) {
            .form-row,
            .form-row-full {
                grid-template-columns: 1fr;
            }
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
        }

        .register-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .register-footer {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid #cbd5e0;
            padding-top: 20px;
        }

        .register-footer p {
            font-size: 13px;
            color: #718096;
            margin: 0;
        }

        .register-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .register-footer a:hover {
            color: #5568d3;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #5568d3;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <a href="index.html" class="back-link">← Volver</a>
            <h1>Registrarse</h1>
            <p>Crea tu cuenta</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Nombre Completo</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <hr style="border: none; border-top: 1px solid #cbd5e0; margin: 24px 0;">

                <div class="form-group">
                    <label for="bloque">Bloque</label>
                    <select id="bloque" name="bloque" required>
                        <option value="">Selecciona un bloque</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="portal">Portal</label>
                        <select id="portal" name="portal" required>
                            <option value="">Selecciona un portal</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="planta">Planta</label>
                        <select id="planta" name="planta" required onchange="actualizarLetra()">
                            <option value="">Selecciona una planta</option>
                            <option value="Bajo">Bajo</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="Atico">Ático</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="letra">Letra</label>
                    <select id="letra" name="letra" required>
                        <option value="">Selecciona una letra</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>

                <button type="submit" class="register-btn">Registrarse</button>
            </form>

            <div class="register-footer">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>

    <script>
        function actualizarLetra() {
            const plantaSelect = document.getElementById('planta');
            const letraSelect = document.getElementById('letra');
            
            if (plantaSelect.value === 'Atico') {
                letraSelect.value = 'A';
                letraSelect.disabled = true;
            } else {
                letraSelect.disabled = false;
                letraSelect.value = '';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const bloque = document.getElementById('bloque').value;
            const portal = document.getElementById('portal').value;
            const planta = document.getElementById('planta').value;
            const letra = document.getElementById('letra').value;
            
            if (password !== confirmPassword) {
                alert('Las contraseñas no coinciden');
                return;
            }
            
            if (!name || !email || !password || !bloque || !portal || !planta || !letra) {
                alert('Todos los campos son obligatorios');
                return;
            }
            
            console.log('Intento de registro con:', {
                name,
                email,
                bloque,
                portal,
                planta,
                letra
            });
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
